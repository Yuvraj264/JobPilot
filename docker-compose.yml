services:
  db:
    image: postgres:15-alpine
    container_name: jobpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot_dev_password
      POSTGRES_DB: jobpilot_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
